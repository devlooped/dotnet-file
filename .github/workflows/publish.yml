# Builds a final release version and pushes to nuget.org 
# whenever a release is published.
# nuget.org: Trusted Publishing (GitHub Actions OIDC) in the nuget job, stable releases only.

name: publish
on:
  release:
    types: [prereleased, released]

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  PackOnBuild: true
  GeneratePackageOnBuild: true
  VersionLabel: refs/tags/${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  SLEET_FEED_URL: https://api.nuget.org/v3/index.json
      
jobs:
  publish:
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        shell: pwsh
        run: dnx --yes retest -- --no-build

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs
          path: '*.binlog'

      - name: ✅ validate
        shell: pwsh
        working-directory: bin
        run: |
          $invalid = Get-ChildItem -File -Filter "*.42.42*.nupkg"
          if ($invalid) {
            Write-Error "Found dev/local packages with disallowed 42.42* version prefix:`n$($invalid.Name -join "`n")"
            exit 1
          }

      - name: 📦 packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: bin/*.nupkg
          if-no-files-found: error

      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: env.SLEET_CONNECTION != ''
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r)        
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  # Stable releases only: prereleases do not publish to nuget.org.
  # Only this job may request a GitHub OIDC token, which NuGet/login exchanges
  # for a short-lived API key: no long-lived NuGet API key is stored.
  #
  # Trusted publishing policy on https://www.nuget.org/account/trustedpublishing,
  # created by kzu (NuGet/login rejects an organization username, so the user is
  # vars.NUGET_OIDC, or secrets.NUGET_OIDC, and not Devlooped):
  #   Package owner: Devlooped
  #   Repository owner: devlooped
  #   Repository: dotnet-file
  #   Workflow file: publish.yml
  #   Environment: nuget
  #   Scope: Push only new package versions, of package dotnet-file
  # The GitHub environment must be named nuget too. A release run's GITHUB_REF is
  # refs/tags/<tag_name>: a deployment branch/tag rule on it must allow that ref.
  # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
  # https://github.com/NuGet/login
  nuget:
    needs: publish
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: bin

      - name: 🔑 nuget login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_OIDC || secrets.NUGET_OIDC }}

      - name: 🚀 nuget
        working-directory: bin
        run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
